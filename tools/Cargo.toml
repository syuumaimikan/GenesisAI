# tools/Cargo.toml
[package]
name = "genesis-tools"
version = "0.1.0"
edition = "2021"

[dependencies]
genesis-core = { path = "../core" }
genesis-plugin-sdk = { path = "../plugin-sdk" }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
async-trait = "0.1"
tracing = "0.1"
reqwest = { version = "0.11", features = ["json"] }
urlencoding = "2.1"
scraper = "0.18" # 追加：Pure Rust 高速HTML解析エンジン