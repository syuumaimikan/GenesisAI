# npc-runtime/Cargo.toml
[package]
name = "genesis-npc-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
genesis-core = { path = "../core" }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"