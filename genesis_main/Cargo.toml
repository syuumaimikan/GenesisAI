[package]
name = "genesis_main"
version = "0.1.0"
edition = "2021"

[dependencies]
# パスを「./」から「../」に変更し、親ディレクトリのメンバを参照させます
genesis-core = { path = "../core" }
genesis-runtime = { path = "../runtime" }
genesis-npc-runtime = { path = "../npc-runtime" }
genesis-memory = { path = "../memory" }
genesis-planning = { path = "../planning" }
genesis-plugin-sdk = { path = "../plugin-sdk" }
genesis-tools = { path = "../tools" }
genesis_self_improvement = { path = "../self_improvement" }

tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
uuid = { version = "1.6", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
reqwest = { version = "0.11", features = ["json"] }
chrono = "0.4"