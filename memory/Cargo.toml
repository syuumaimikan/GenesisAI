[package]
name = "genesis-memory"
version = "0.1.0"
edition = "2021"

[dependencies]
genesis-core = { path = "../core" }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
tracing = "0.1"
async-trait = "0.1"